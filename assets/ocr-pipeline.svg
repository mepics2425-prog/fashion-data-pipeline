<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#171b35"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.tt{fill:#f8fafc;font-size:52px;font-weight:800} .st{fill:#a5b4fc;font-size:25px;font-weight:600}
.h{fill:#f8fafc;font-size:27px;font-weight:750} .t{fill:#cbd5e1;font-size:20px;font-weight:500}
.s{fill:#94a3b8;font-size:17px;font-weight:500} .ln{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arr)}
</style></defs><rect width="100%" height="100%" fill="url(#bg)"/>
<text x="70" y="85" class="tt">29CM OCR Pipeline</text>
<text x="70" y="130" class="st">구조화 데이터가 없을 때만 OCR로 보완</text>
<rect x="40" y="250" width="180" height="150" rx="24" fill="#111827" stroke="#475569" stroke-width="2.5"/>
<text x="130.0" y="298" text-anchor="middle" class="h">1. Detail</text>
<text x="130.0" y="334" text-anchor="middle" class="s">상품 상세 확인</text>
<rect x="265" y="250" width="180" height="150" rx="24" fill="#0d2345" stroke="#3b82f6" stroke-width="2.5"/>
<text x="355.0" y="298" text-anchor="middle" class="h">2. Check</text>
<text x="355.0" y="334" text-anchor="middle" class="s">구조화 실측 여부</text>
<rect x="490" y="250" width="180" height="150" rx="24" fill="#2a2110" stroke="#f59e0b" stroke-width="2.5"/>
<text x="580.0" y="298" text-anchor="middle" class="h">3. Queue</text>
<text x="580.0" y="334" text-anchor="middle" class="s">OCR 대상만 적재</text>
<rect x="715" y="250" width="180" height="150" rx="24" fill="#2a2110" stroke="#f59e0b" stroke-width="2.5"/>
<text x="805.0" y="298" text-anchor="middle" class="h">4. Preview</text>
<text x="805.0" y="334" text-anchor="middle" class="s">저해상도 후보 탐색</text>
<rect x="940" y="250" width="180" height="150" rx="24" fill="#24164b" stroke="#8b5cf6" stroke-width="2.5"/>
<text x="1030.0" y="298" text-anchor="middle" class="h">5. OCR</text>
<text x="1030.0" y="334" text-anchor="middle" class="s">선택 이미지 정밀 OCR</text>
<rect x="1165" y="250" width="180" height="150" rx="24" fill="#0f2a25" stroke="#10b981" stroke-width="2.5"/>
<text x="1255.0" y="298" text-anchor="middle" class="h">6. Validate</text>
<text x="1255.0" y="334" text-anchor="middle" class="s">치수명 · 값 검증</text>
<rect x="1390" y="250" width="170" height="150" rx="24" fill="#0d2345" stroke="#3b82f6" stroke-width="2.5"/>
<text x="1475.0" y="298" text-anchor="middle" class="h">7. DB</text>
<text x="1475.0" y="334" text-anchor="middle" class="s">정규화 적재</text>
<rect x="280" y="520" width="1040" height="120" rx="24" fill="#111827" stroke="#475569" stroke-width="2.5"/>
<text x="800.0" y="568" text-anchor="middle" class="h">Optimization</text>
<text x="800.0" y="604" text-anchor="middle" class="s">모든 이미지가 아니라 사이즈표 후보를 먼저 좁힌 뒤 정밀 OCR</text>
<path d="M220 325 L265 325" class="ln"/>
<path d="M445 325 L490 325" class="ln"/>
<path d="M670 325 L715 325" class="ln"/>
<path d="M895 325 L940 325" class="ln"/>
<path d="M1120 325 L1165 325" class="ln"/>
<path d="M1345 325 L1390 325" class="ln"/>
</svg>