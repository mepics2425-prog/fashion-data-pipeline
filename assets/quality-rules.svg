<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#171b35"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#64748b"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.tt{fill:#f8fafc;font-size:52px;font-weight:800} .st{fill:#a5b4fc;font-size:25px;font-weight:600}
.h{fill:#f8fafc;font-size:27px;font-weight:750} .t{fill:#cbd5e1;font-size:20px;font-weight:500}
.s{fill:#94a3b8;font-size:17px;font-weight:500} .ln{stroke:#64748b;stroke-width:4;fill:none;marker-end:url(#arr)}
</style></defs><rect width="100%" height="100%" fill="url(#bg)"/>
<text x="70" y="85" class="tt">Category-aware Data Quality</text>
