<rect x="170" y="190" width="1260" height="105" rx="24" fill="#0d2345" stroke="#3b82f6" stroke-width="2.5"/>
<text x="800.0" y="238" text-anchor="middle" class="h">TOP / OUTER</text>
<text x="800.0" y="274" text-anchor="middle" class="s">가슴 + 총장 + (어깨 또는 소매)</text>
