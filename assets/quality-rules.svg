<text x="800.0" y="414" text-anchor="middle" class="s">허리 + (힙 또는 허벅지) + (총장 또는 밑위)</text>
<rect x="170" y="470" width="1260" height="105" rx="24" fill="#24164b" stroke="#8b5cf6" stroke-width="2.5"/>
<text x="800.0" y="518" text-anchor="middle" class="h">SKIRT</text>
